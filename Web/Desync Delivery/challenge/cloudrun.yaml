apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: desync-delivery
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/container-dependencies: '{"edge":["backend"],"gateway":["edge"]}'
        run.googleapis.com/execution-environment: gen1
        run.googleapis.com/secrets: "desync-delivery-flag:projects/361392572073/secrets/desync-delivery-flag"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 300
      serviceAccountName: desync-delivery-runtime@desync-delivery.iam.gserviceaccount.com
      containers:
        - name: gateway
          image: us-east5-docker.pkg.dev/desync-delivery/desync-delivery/gateway:v3
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: EDGE_HOST
              value: 127.0.0.1
            - name: EDGE_PORT
              value: "8081"
          resources:
            limits:
              cpu: "0.25"
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: 8080
            timeoutSeconds: 1
            periodSeconds: 2
            failureThreshold: 30
        - name: edge
          image: us-east5-docker.pkg.dev/desync-delivery/desync-delivery/edge:v3
          env:
            - name: BACKEND_HOST
              value: 127.0.0.1
            - name: BACKEND_PORT
              value: "5000"
            - name: LISTEN_PORT
              value: "8081"
          resources:
            limits:
              cpu: "0.25"
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: 8081
            timeoutSeconds: 1
            periodSeconds: 2
            failureThreshold: 30
        - name: backend
          image: us-east5-docker.pkg.dev/desync-delivery/desync-delivery/backend:v3
          env:
            - name: LISTEN_PORT
              value: "5000"
            - name: FLAG
              valueFrom:
                secretKeyRef:
                  name: desync-delivery-flag
                  key: latest
          resources:
            limits:
              cpu: "0.25"
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: 5000
            timeoutSeconds: 1
            periodSeconds: 2
            failureThreshold: 30
