apiVersion: kctf.dev/v1
kind: Challenge
metadata:
  name: desync-delivery
spec:
  deployed: true
  powDifficultySeconds: 0
  network:
    public: true
    ports:
      - protocol: HTTPS
        targetPort: 8080
  healthcheck:
    enabled: true
    image: kind/healthcheck
  image: kind/challenge
  podTemplate:
    template:
      spec:
        containers:
          - name: challenge
            resources:
              requests:
                cpu: 100m
                memory: 64Mi
              limits:
                cpu: "1"
                memory: 256Mi
